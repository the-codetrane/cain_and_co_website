name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # Jobs run in order: scans, lint and unit tests in parallel, then system tests (when
  # present), then Dependabot auto-merge (PRs) or deploy (main). Each later stage starts only
  # once the one before it has passed.
  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      # Active Storage loads the vips transformer at boot, and with image_processing 2.x a
      # missing libvips raises instead of logging a warning.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # Cheap detector: only spin up the (slow, browser-driven) system-test job once
  # system tests actually exist. Auto-enables when test/system/*_test.rb is added.
  detect-system-tests:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if compgen -G "test/system/*_test.rb" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  system-test:
    needs: [scan_ruby, scan_js, lint, test, detect-system-tests]
    if: needs.detect-system-tests.outputs.present == 'true'
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Merge Dependabot's patch and minor bumps once every check above has passed; majors
  # still wait for a human. This repo is private on the free plan, so there is no branch
  # protection and GitHub's native auto-merge would merge before CI finishes. Gating on
  # `needs` here is what guarantees the PR was validated. system-test may be skipped only
  # because the detector found no system tests, never because a job it depends on failed.
  #
  # A merge made with GITHUB_TOKEN does not trigger the push run on main, so these
  # bumps do not deploy on their own; they ship with the next push to main.
  dependabot-auto-merge:
    needs: [scan_ruby, scan_js, lint, test, detect-system-tests, system-test]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && needs.scan_ruby.result == 'success'
      && needs.scan_js.result == 'success'
      && needs.lint.result == 'success'
      && needs.test.result == 'success'
      && (needs.system-test.result == 'success' || (needs.system-test.result == 'skipped' && needs.detect-system-tests.outputs.present == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Merge patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit refuses to merge if Dependabot pushed a new commit (e.g. a
        # rebase) after this run started; that push gets its own CI run.
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"

  # Same gate as dependabot-auto-merge. That job never runs on a push, so depending on it
  # only fixes its place in the order; its "skipped" result is expected here.
  deploy:
    needs: [scan_ruby, scan_js, lint, test, detect-system-tests, system-test, dependabot-auto-merge]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.scan_ruby.result == 'success'
      && needs.scan_js.result == 'success'
      && needs.lint.result == 'success'
      && needs.test.result == 'success'
      && (needs.system-test.result == 'success' || (needs.system-test.result == 'skipped' && needs.detect-system-tests.outputs.present == 'false'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Trust the server's pinned host keys rather than scanning them at deploy time. A scan
      # trusts whatever answers on that IP, and deploys intermittently failed with
      # Net::SSH::HostKeyMismatch even though the server's key had not changed. If the server
      # is rebuilt, refresh .kamal/known_hosts (see the comment at the top of that file).
      - name: Trust deployment server host key
        run: |
          ssh-keygen -R 167.172.146.61 2>/dev/null || true
          grep -v '^#' .kamal/known_hosts >> ~/.ssh/known_hosts
          echo "Host keys trusted for 167.172.146.61:"
          ssh-keygen -lF 167.172.146.61

      # A key that is present but wrong is not caught until the container boots, where it
      # surfaces as "AEAD authentication tag verification failed" and a deploy that spends
      # four minutes timing out on a health check that can never pass. Prove the key opens
      # the credentials first, so a bad secret fails here in seconds with a legible message.
      - name: Verify RAILS_MASTER_KEY decrypts the production credentials
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/verify_credentials_key production

      - name: Deploy with Kamal
        env:
          # .kamal/secrets reads config/credentials/production.key when present and falls
          # back to this. The key file is gitignored, so on a runner this is the only source.
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/kamal deploy
