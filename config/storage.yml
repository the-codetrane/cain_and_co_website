test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

digitalocean:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:digitalocean, :spaces_key) %>
  secret_access_key: <%= Rails.application.credentials.dig(:digitalocean, :spaces_secret) %>
  endpoint: https://sfo3.digitaloceanspaces.com
  region: sfo3
  bucket: ig-mcp-images
  public: true
