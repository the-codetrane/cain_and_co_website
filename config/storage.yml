test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

digitalocean:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:digitalocean, :spaces_key) %>
  secret_access_key: <%= Rails.application.credentials.dig(:digitalocean, :spaces_secret) %>
  endpoint: https://sfo3.digitaloceanspaces.com
  region: sfo3
  bucket: ig-mcp-images
  public: true
  # A blob's key never changes hands (a replaced image gets a new key), so stored files
  # are safe to cache forever. Overwriting a file by hand needs a CDN purge.
  upload:
    cache_control: "public, max-age=31536000, immutable"
