#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  sync_bandsintown_events:
    class: SyncBandsintownEventsJob
    schedule: every hour at minute 5
  # Resume in-flight newsletter sends: pick up recipients deferred by the daily
  # cap (after the count rolls over) and finalize completed sends.
  drain_newsletter_deliveries:
    class: DrainNewsletterDeliveriesJob
    schedule: every hour at minute 20
