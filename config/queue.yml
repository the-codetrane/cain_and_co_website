default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # General worker. Queues are listed EXPLICITLY (not "*") on purpose: a "*"
    # worker would also drain :newsletters and break its single-thread throttle.
    # Add any new queue here, otherwise its jobs will never run.
    - queues: [ default, mailers ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Newsletter sends only: one thread / one process serializes SMTP
    # connections so we never burst the provider. Daily volume is capped
    # separately (NewsletterDispatch.daily_cap).
    - queues: newsletters
      threads: 1
      processes: 1
      polling_interval: 0.5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
